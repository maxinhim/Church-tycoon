<title>교회개척 타이쿤</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: 전체화면 아이소메트릭 지도 위에 떠 있는 HUD. 세로: 상단바 / 지도 / 상태바 / 건축 패널. 가로(낮은 화면): 오른쪽에 패널 기둥. */
:root{
  --bg:#dfe7ea; --glass:rgba(248,250,251,.94); --glass-line:rgba(20,33,43,.12);
  --ink:#14212b; --muted:#566673; --line:#c8d3da; --chip:#e1e8ec; --card:#eef3f5;
  --accent:#2a56c6; --accent-ink:#ffffff; --gold:#93650a; --good:#1f7a52; --bad:#b83a2b;
  --shadow:0 6px 22px rgba(8,18,28,.28);
  --f-display:"Gowun Batang","Nanum Myeongjo","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b141b; --glass:rgba(20,31,40,.93); --glass-line:rgba(255,255,255,.09);
    --ink:#e5edf2; --muted:#93a6b4; --line:#2c3d4a; --chip:#233441; --card:#1a2833;
    --accent:#7aa0ff; --accent-ink:#0b141b; --gold:#e3b341; --good:#4cc28a; --bad:#ff8a78; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b141b; --glass:rgba(20,31,40,.93); --glass-line:rgba(255,255,255,.09);
  --ink:#e5edf2; --muted:#93a6b4; --line:#2c3d4a; --chip:#233441; --card:#1a2833;
  --accent:#7aa0ff; --accent-ink:#0b141b; --gold:#e3b341; --good:#4cc28a; --bad:#ff8a78; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:14px; line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:0; padding-bottom:0; overflow:hidden; overscroll-behavior:none;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#stage{position:fixed;inset:0;background:#132a37}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#ui{position:relative;height:100%;display:flex;flex-direction:column;gap:8px;padding-block:8px;pointer-events:none}
.glass{background:var(--glass);border:1px solid var(--glass-line);border-radius:14px;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);pointer-events:auto}
#top,#status,#dock{width:100%;max-width:600px;align-self:center}

#top{display:flex;align-items:center;gap:10px;padding:7px 8px 7px 12px}
.ttl{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);min-width:0}
.goal span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:28px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.goal .bar{flex:0 0 52px}
.sp{display:flex;background:var(--chip);border-radius:10px;padding:2px;gap:2px;flex:none}
.sp button{border:0;background:transparent;min-width:34px;height:32px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted)}
.sp button.on{background:var(--accent);color:var(--accent-ink)}

#mid{flex:1;min-height:0;position:relative}
.tools{position:absolute;right:0;top:4px;display:flex;flex-direction:column;gap:8px}
.tools button{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;padding:0;border:1px solid var(--glass-line)}
.tools svg{width:20px;height:20px}
#toast{position:absolute;left:0;top:4px;width:max-content;max-width:calc(100% - 54px);background:rgba(12,22,30,.9);color:#fff;padding:7px 12px;border-radius:10px;font-size:12.5px;text-align:center;pointer-events:none;box-shadow:0 2px 10px rgba(0,0,0,.3)}

#status{display:grid;grid-template-columns:1.3fr .9fr .9fr 1fr;gap:4px;padding:6px 10px}
.stat{min-width:0}
.stat .k{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b{display:block;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b.neg{color:var(--bad)}
.stat small{font-weight:400;color:var(--muted);font-size:11px}

#dock{overflow:hidden;display:flex;flex-direction:column}
.tabs{display:grid;grid-template-columns:repeat(4,1fr) 44px;border-bottom:1px solid var(--line);flex:none}
#dock.fold .tabs{border-bottom:0}
.tabs button{border:0;background:transparent;height:38px;font-weight:600;color:var(--muted)}
.tabs button.on{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
#dock.fold .tabs button.on{box-shadow:none}
.tabs .fold svg{width:18px;height:18px;transition:transform .2s}
#dock.fold .tabs .fold svg{transform:rotate(180deg)}
#panel{height:192px;padding:8px 10px;overflow:hidden}
#panel.scroll{overflow-y:auto}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--chip);border-radius:999px;padding:0 13px;height:28px;font-size:13px;font-weight:500}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.chip.warn.on{background:var(--bad);color:#fff}
.cards{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;min-height:84px}
.card{flex:none;width:78px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:4px 4px 3px;display:flex;flex-direction:column;align-items:center;gap:1px}
.card canvas{display:block}
.card .nm{font-size:11.5px;font-weight:600;white-space:nowrap}
.card .pr{font-size:11px;color:var(--gold);font-variant-numeric:tabular-nums;font-weight:600}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.card.poor{opacity:.5}
.hint{margin:0;color:var(--muted);font-size:13px;padding:8px 2px}
.detail{display:flex;align-items:center;gap:8px;justify-content:space-between;min-height:46px;margin-top:2px;font-size:12px;color:var(--muted)}
.detail .tx{min-width:0;flex:1;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.detail .tx b{color:var(--ink);font-size:13px}
.btns{display:flex;gap:6px;flex:none}
.btn{border:1px solid var(--line);background:var(--chip);border-radius:9px;height:34px;padding:0 12px;font-weight:600;font-size:13px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45}
.staff{display:flex;flex-direction:column;gap:8px}
.srow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:7px 9px;background:var(--card)}
.srow .tx{flex:1;min-width:0}
.srow b{font-size:14px}
.srow p{margin:0;font-size:11.5px;color:var(--muted)}
.pips{display:flex;gap:3px;margin-top:3px}
.pips i{width:16px;height:5px;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--accent)}
.cov{display:grid;grid-template-columns:62px 1fr 38px;gap:4px 8px;align-items:center;font-size:12px}
.cov .bar{height:7px}
.cov .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.sec{font-family:var(--f-display);font-weight:700;font-size:14px;margin:10px 0 5px}
.sec:first-child{margin-top:0}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.log{margin:0;padding:0;list-style:none;font-size:12px;color:var(--muted)}
.log li{padding:2px 0;border-bottom:1px dashed var(--line)}
.field{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.field label{font-size:12px;color:var(--muted);flex:none}
.field input{flex:1;min-width:0;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 10px;font:inherit;-webkit-user-select:text;user-select:text}
.refs{margin:4px 0 0;padding-left:16px;font-size:12px;color:var(--muted)}
.refs a{color:var(--accent)}
.how{margin:0;padding-left:16px;font-size:12px;color:var(--muted)}
svg text{fill:var(--muted);font-family:var(--f-body)}
#over{position:fixed;inset:0;background:rgba(8,16,22,.72);display:grid;place-items:center;padding:20px;pointer-events:auto;z-index:5}
#over .box{background:var(--glass);border-radius:14px;padding:20px;max-width:320px;text-align:center;display:flex;flex-direction:column;gap:10px}
#over h2{margin:0;font-family:var(--f-display);font-size:20px}
#over p{margin:0;color:var(--muted)}

@media (orientation:landscape) and (max-height:560px){
  #ui{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,34%);grid-template-rows:auto minmax(0,1fr) auto;column-gap:10px;row-gap:8px}
  #top{grid-column:1;grid-row:1;max-width:none}
  #mid{grid-column:1;grid-row:2}
  #status{grid-column:1;grid-row:3;max-width:none}
  #dock{grid-column:2;grid-row:1/4;max-width:none;align-self:stretch}
  #dock.fold{align-self:start}
  #panel{flex:1;height:auto;min-height:0}
  #panel.build{overflow-y:auto}
}
@media (prefers-reduced-motion:reduce){.bar i,.tabs .fold svg{transition:none}}
</style>

    </nav>
    <div id="panel"></div>
  </section>
</div>
<div id="over" hidden></div>

  {n:'동네의 이웃',d:'성도 120명 · 평판 65',t:function(s){return s.members>=120&&s.rep>=65;},p:function(s){return Math.min(s.members/120,s.rep/65);},r:1500},
  {n:'지역을 섬기는 교회',d:'성도 200명 · 평판 80',t:function(s){return s.members>=200&&s.rep>=80;},p:function(s){return Math.min(s.members/200,s.rep/80);},r:0}

/* ---------- 상태 ---------- */
var S,A,occ,V=[],F=[],ctx,cv,DPR=1,VW=0,VH=0;
var UI={tab:'build',cat:'worship',tool:null,ghost:null,sel:null,speed:1,fold:false,confirmNew:false};
var DIRS=[[1,0],[-1,0],[0,1],[0,-1]];

function newState(){
  return {name:'새빛교회',money:6000,members:6,rep:30,week:0,t:0,clock:0,
    buildings:[{id:1,def:'room',x:6,y:9,inUse:0,uses:0},{id:2,def:'tree',x:2,y:3,inUse:0,uses:0},{id:3,def:'tree',x:12,y:2,inUse:0,uses:0},
      {id:4,def:'tree',x:13,y:11,inUse:0,uses:0},{id:5,def:'tree',x:1,y:12,inUse:0,uses:0},{id:6,def:'tree',x:9,y:5,inUse:0,uses:0}],nextId:7,
    staff:{evang:0,praise:0,care:0},mood:80,cov:{seat:1,fel:1,care:1,comf:1,park:1},
    hist:[],log:[],goal:0,over:false,evt:null,evtLeft:0,weekInc:0,spawnAcc:0,visitsWeek:0,joinedWeek:0};
}
function bById(id){for(var i=0;i<S.buildings.length;i++)if(S.buildings[i].id===id)return S.buildings[i];return null;}
function rebuildOcc(){
  occ=[];for(var y=0;y<ROWS;y++){occ.push(new Array(COLS).fill(0));}
  S.buildings.forEach(function(b){var d=D[b.def];for(var j=0;j<d.h;j++)for(var i=0;i<d.w;i++)occ[b.y+j][b.x+i]=b.id;});
}
function agg(){
  var a={seats:0,fcap:0,ccap:0,kcap:0,park:0,beauty:0,vis:0,up:0,rep:0};
  S.buildings.forEach(function(b){var d=D[b.def];a.seats+=d.seats;a.fcap+=d.fcap;a.ccap+=d.ccap;a.kcap+=d.kcap;a.park+=d.park;a.beauty+=d.beauty;a.vis+=d.vis;a.up+=d.up;a.rep+=d.rep;});
  return a;
}
function calcMood(){
  var m=Math.max(1,S.members);
  var cov=function(have,need){return Math.min(1,have/Math.max(1,need));};
  var seat=cov(A.seats,m),fel=cov(A.fcap+3,m*0.55),care=cov(A.kcap+2,m*0.3),comf=cov(A.ccap+3,m*0.25),park=cov(A.park+3,m*0.35);
  var mood=100*(0.32*seat+0.2*fel+0.16*care+0.12*comf+0.2*park)+Math.min(10,A.beauty*0.9)+S.staff.praise*3+S.staff.care*2;
  return {mood:clamp(mood,0,100),seat:seat,fel:fel,care:care,comf:comf,park:park};
}
function recalc(){A=agg();var m=calcMood();S.mood=m.mood;S.cov=m;}

/* ---------- 길찾기 ---------- */
function goalFor(b){
  var d=D[b.def];
  return function(x,y){
    if(x<b.x-1||x>b.x+d.w||y<b.y-1||y>b.y+d.h)return false;
    var ox=(x<b.x||x>=b.x+d.w),oy=(y<b.y||y>=b.y+d.h);
    return !(ox&&oy);
  };
}
function bfs(sx,sy,isGoal){
  if(isGoal(sx,sy))return [];
  var W=COLS,H=ROWS,prev=new Int16Array(W*H).fill(-1),seen=new Uint8Array(W*H),s=sy*W+sx,q=[s];
  seen[s]=1;
  for(var qi=0;qi<q.length;qi++){
    var cur=q[qi],cx=cur%W,cy=(cur/W)|0;
    for(var k=0;k<4;k++){
      var nx=cx+DIRS[k][0],ny=cy+DIRS[k][1];
      if(nx<0||ny<0||nx>=W||ny>=H)continue;
      var ni=ny*W+nx;
      if(seen[ni]||occ[ny][nx])continue;
      seen[ni]=1;prev[ni]=cur;
      if(isGoal(nx,ny)){
        var path=[],c=ni;
        while(c!==s){path.push({x:c%W,y:(c/W)|0});c=prev[c];}
        path.reverse();return path;
      }
      q.push(ni);
    }
  }
  return null;
}

/* ---------- 방문자 ---------- */
function spawnV(){
  var needs={};NEEDS.forEach(function(n){needs[n]=22+Math.random()*34;});
  V.push({x:ENT+0.5,y:ROWS-0.5,needs:needs,state:'idle',t:0.2,path:null,pi:0,target:0,want:'',inside:0,wait:0,annoy:0,idleN:0,blocked:{},
    life:38+Math.random()*20,speed:1.5+Math.random()*0.6,ph:Math.random()*6.28,
    tint:['#c75b4a','#4a78c7','#8a5bb5','#d19a2e','#3d9b7a','#b5587f','#e0e0e0'][(Math.random()*7)|0],
    pant:['#3b4252','#5b4a3a','#2f3e5c'][(Math.random()*3)|0],dead:false});
}
function moveAlong(v,dt){
  var rem=v.speed*dt;
  while(rem>0&&v.pi<v.path.length){
    var p=v.path[v.pi];
    if(occ[p.y][p.x])return 'blocked';
    var tx=p.x+0.5,ty=p.y+0.5,dx=tx-v.x,dy=ty-v.y,d=Math.hypot(dx,dy);
    if(d<=rem){v.x=tx;v.y=ty;v.pi++;rem-=d;}
    else{v.x+=dx/d*rem;v.y+=dy/d*rem;rem=0;}
  }
  return v.pi>=v.path.length;
}
function arrive(v){
  if(!v.target){v.state='idle';v.t=0.8+Math.random();return;}
  var b=bById(v.target);
  if(!b){v.state='idle';v.t=0.2;v.target=0;return;}
  if(b.inUse<D[b.def].cap)enter(v,b);
  else{v.state='wait';v.wait=5;}
}
function enter(v,b){b.inUse++;v.state='inside';v.inside=b.id;v.t=D[b.def].dur*(0.8+Math.random()*0.4);}
function finishVisit(v){
  var b=bById(v.inside);
  if(b){
    var d=D[b.def];b.inUse=Math.max(0,b.inUse-1);b.uses=(b.uses||0)+1;
    for(var n in d.fill){
      var amt=d.fill[n];
      if(n==='care')amt*=1+0.15*S.staff.care;
      if(n==='word')amt*=1+0.08*S.staff.praise;
      v.needs[n]=Math.min(100,v.needs[n]+amt);
    }
    if(d.income){S.money+=d.income;S.weekInc+=d.income;}
  }
  v.inside=0;v.target=0;v.state='idle';v.t=0.3;v.idleN=0;
}
function goLeave(v){
  var p=bfs(Math.floor(v.x),Math.floor(v.y),function(x,y){return y===ROWS-1&&x===ENT;});
  if(!p){depart(v);return;}
  v.path=p;v.pi=0;v.state='leave';v.target=0;
  if(!p.length)depart(v);
}
function depart(v){
  v.dead=true;
  var avg=NEEDS.reduce(function(s,n){return s+v.needs[n];},0)/4-v.annoy*5;
  S.rep=clamp(S.rep+(avg-58)*0.006,0,100);
  S.visitsWeek++;
  var p=clamp((avg-42)/50,0,1)*0.6*(1+0.1*S.staff.evang)*(v.needs.word>=45?1:0.25);
  if(Math.random()<p){S.members++;S.joinedWeek++;F.push({x:ENT+0.5,y:ROWS-1.2,t:1.6,text:'+1 성도'});}
}
function decide(v){
  var avg=NEEDS.reduce(function(s,n){return s+v.needs[n];},0)/4;
  if(v.life<=0||avg>=80){goLeave(v);return;}
  var order=NEEDS.slice().sort(function(a,b){return v.needs[a]-v.needs[b];});
  for(var oi=0;oi<order.length;oi++){
    var n=order[oi];
    if(v.needs[n]>=75)continue;
    var cands=S.buildings.filter(function(b){var d=D[b.def];return d.fill&&d.fill[n]&&!(v.blocked[b.id]>S.clock);});
    cands.sort(function(a,b){return (Math.abs(a.x-v.x)+Math.abs(a.y-v.y))-(Math.abs(b.x-v.x)+Math.abs(b.y-v.y));});
    for(var ci=0;ci<Math.min(3,cands.length);ci++){
      var b=cands[ci],p=bfs(Math.floor(v.x),Math.floor(v.y),goalFor(b));
      if(p){v.path=p;v.pi=0;v.target=b.id;v.want=n;v.state='walk';if(!p.length)arrive(v);return;}
    }
  }
  v.idleN++;
  if(v.idleN>=3){goLeave(v);return;}
  var tx=clamp(Math.floor(v.x)+((Math.random()*7)|0)-3,0,COLS-1),ty=clamp(Math.floor(v.y)+((Math.random()*7)|0)-3,0,ROWS-1);
  if(occ[ty][tx]){v.t=0.5;return;}
  var wp=bfs(Math.floor(v.x),Math.floor(v.y),function(x,y){return x===tx&&y===ty;});
  if(wp&&wp.length){v.path=wp;v.pi=0;v.target=0;v.want='';v.state='walk';}else v.t=0.6;
}
function stepV(v,dt){
  v.life-=dt;
  if(v.state==='walk'||v.state==='leave'){
    var r=moveAlong(v,dt);
    if(r==='blocked'){
      if(v.state==='leave')goLeave(v);else{v.state='idle';v.t=0.2;v.target=0;}
      return;
    }
    if(r===true){if(v.state==='leave')depart(v);else arrive(v);}
  }else if(v.state==='wait'){
    var b=bById(v.target);
    if(!b){v.state='idle';v.t=0.2;v.target=0;return;}
    if(b.inUse<D[b.def].cap)enter(v,b);
    else{v.wait-=dt;if(v.wait<=0){v.annoy++;v.blocked[v.target]=S.clock+14;v.target=0;v.state='idle';v.t=0.3;}}
  }else if(v.state==='inside'){
    v.t-=dt;if(v.t<=0)finishVisit(v);
  }else if(v.state==='idle'){
    v.t-=dt;if(v.t<=0)decide(v);
  }
}

/* ---------- 시뮬레이션 ---------- */
function update(dt){
  if(S.over)return;
  S.clock+=dt;S.t+=dt;
  var evM=S.evt==='festival'?1.6:(S.evt==='rain'?0.5:1);
  var parkF=clamp((A.park+4)/(S.members*0.35+6),0.35,1);
  var rate=0.22*(0.45+S.rep/70)*(1+0.25*S.staff.evang)*(1+A.vis)*parkF*evM+S.members*0.004;
  S.spawnAcc+=rate*dt;
  while(S.spawnAcc>=1){S.spawnAcc-=1;if(V.length<40)spawnV();}
  for(var i=0;i<V.length;i++)stepV(V[i],dt);
  V=V.filter(function(v){return !v.dead;});
  for(var j=0;j<F.length;j++){F[j].t-=dt;}
  F=F.filter(function(f){return f.t>0;});
  if(S.t>=WEEK){S.t-=WEEK;weekEnd();}
}
function addLog(msg){S.log.unshift({w:S.week,msg:msg});if(S.log.length>8)S.log.length=8;}
function weekEnd(){
  recalc();
  var mood=S.mood;
  var attend=Math.min(S.members,A.seats);
  var offering=attend*10*(0.4+0.6*mood/100)*(1+0.15*S.staff.praise);
  var sponsor=Math.max(0,260-6.5*S.week);
  var exp=160+A.up+S.staff.evang*STAFF.evang.week+S.staff.praise*STAFF.praise.week+S.staff.care*STAFF.care.week;
  var inc=offering+sponsor+S.weekInc;
  S.money+=offering+sponsor-exp;
  S.hist.push({inc:inc,exp:exp});if(S.hist.length>12)S.hist.shift();
  var msg='주일예배 · 출석 '+attend+'명 · 헌금 +'+fmt(offering)+(sponsor>0?' · 후원 +'+fmt(sponsor):'')+' · 지출 −'+fmt(exp);
  var lose=0,gain=0;
  if(mood<50)lose+=Math.floor(S.members*0.07*(50-mood)/50+Math.random());
  if(S.members>A.seats)lose+=Math.floor((S.members-A.seats)*0.3+Math.random());
  if(mood>=55)gain=Math.floor(S.members*0.03*(mood-55)/45+Math.random());
  S.members=Math.max(0,S.members-lose+gain);
  if(lose>0)msg+=' · 성도 '+lose+'명이 떠났어요';
  S.rep=clamp(S.rep+A.rep+(mood-60)*0.015-(S.rep>50?(S.rep-50)*0.05:0),0,100);
  S.weekInc=0;S.visitsWeek=0;S.joinedWeek=0;S.week++;
  if(S.evtLeft>0){S.evtLeft--;if(S.evtLeft===0)S.evt=null;}
  else if(Math.random()<0.14){
    var r=Math.random();
    if(r<0.25){S.evt='rain';S.evtLeft=2;msg='장마철입니다. 2주간 방문자가 줄어요.';}
    else if(r<0.5){S.evt='festival';S.evtLeft=2;msg='동네 축제가 열렸어요. 2주간 거리가 북적여요.';}
    else if(r<0.75){S.money+=400;msg='익명의 감사 헌금 400이 들어왔어요.';}
    else{S.money-=250;msg='난방 설비 수리비 250이 나갔어요.';}
  }
  addLog(msg);toast(msg,4200);
  var g=GOALS[S.goal];
  if(g&&g.t(S)){
    S.money+=g.r;addLog('목표 달성 · '+g.n);
    toast('목표 달성 · '+g.n+(g.r?' (후원금 +'+fmt(g.r)+')':''),4800);
    S.goal++;
  }
  recalc();
  if(S.money<-1500){S.over=true;showOver();}
  save();
  if(UI.tab==='status'&&!UI.fold)renderPanel();
  hud(true);
}

/* ---------- 건축 ---------- */
function canPlace(d,x,y){
  if(x<0||y<0||x+d.w>COLS||y+d.h>ROWS-1)return false;
  for(var j=0;j<d.h;j++)for(var i=0;i<d.w;i++)if(occ[y+j][x+i])return false;
  return true;
}
function bump(){
  V.forEach(function(v){
    var tx=Math.floor(v.x),ty=Math.floor(v.y);
    if(occ[ty]&&occ[ty][tx]&&v.state!=='inside'){v.x=ENT+0.5;v.y=ROWS-0.5;v.state='idle';v.t=0.2;v.target=0;}
  });
}
function build(id,x,y){
  var d=D[id];
  if(S.money<d.cost||!canPlace(d,x,y))return false;
  S.money-=d.cost;
  S.buildings.push({id:S.nextId++,def:id,x:x,y:y,inUse:0,uses:0});
  rebuildOcc();bump();recalc();save();return true;
}
function demolish(id){
  var b=bById(id);if(!b)return;
  var d=D[b.def];
  S.money+=Math.floor(d.cost*0.5);
  S.buildings=S.buildings.filter(function(x){return x.id!==id;});
  V.forEach(function(v){if(v.inside===id){v.inside=0;v.state='idle';v.t=0.2;}if(v.target===id){v.target=0;if(v.state!=='leave'&&v.state!=='inside'){v.state='idle';v.t=0.2;}}});
  rebuildOcc();bump();recalc();save();
}

/* ---------- 저장 ---------- */
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
function load(){
  try{
    var raw=localStorage.getItem(SAVE_KEY);
    if(raw){var o=JSON.parse(raw),n=newState();for(var k in n){if(o[k]===undefined)o[k]=n[k];}
      o.buildings=o.buildings.filter(function(b){return D[b.def];});o.buildings.forEach(function(b){b.inUse=0;});return o;}
  }catch(e){}
  return newState();
}

var ROT=0, cam={ox:0,oy:0,z:0.6}, ZMIN=0.3, ZMAX=2.6, PJ={c:null,ox:0,oy:0,s:1};
function P(rx,ry,z){return [PJ.ox+(rx-ry)*HW*PJ.s, PJ.oy+(rx+ry)*HH*PJ.s-(z||0)*ZH*PJ.s];}
function rotPt(x,y){switch(ROT){case 0:return [x,y];case 1:return [ROWS-y,x];case 2:return [COLS-x,ROWS-y];default:return [y,COLS-x];}}
function unrot(rx,ry){switch(ROT){case 0:return [rx,ry];case 1:return [ry,ROWS-rx];case 2:return [COLS-rx,ROWS-ry];default:return [COLS-ry,rx];}}
function RX(){return ROT%2?ROWS:COLS;} function RY(){return ROT%2?COLS:ROWS;}
function rrect(x0,y0,x1,y1){var a=rotPt(x0,y0),b=rotPt(x1,y1);return {x0:Math.min(a[0],b[0]),y0:Math.min(a[1],b[1]),x1:Math.max(a[0],b[0]),y1:Math.max(a[1],b[1])};}
var hh=function(x,y){var h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967295;};
var SC={};
function shade(hex,f){
  var k=hex+f;if(SC[k])return SC[k];
  var n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  if(f<=1){r*=f;g*=f;b*=f;}else{var t=f-1;r+=(255-r)*t;g+=(255-g)*t;b+=(255-b)*t;}
  return (SC[k]='rgb('+(r|0)+','+(g|0)+','+(b|0)+')');
}
var EDGE='rgba(28,24,20,.32)';
function quad(pts,fill,line){
  var c=PJ.c;c.beginPath();
  for(var i=0;i<pts.length;i++){var q=P(pts[i][0],pts[i][1],pts[i][2]);if(i)c.lineTo(q[0],q[1]);else c.moveTo(q[0],q[1]);}
  c.closePath();
  if(fill){c.fillStyle=fill;c.fill();}
  if(line){c.strokeStyle=line;c.lineWidth=Math.max(.5,PJ.s*.9);c.stroke();}
}
function box(r,z0,z1,col,top){
  quad([[r.x0,r.y1,z0],[r.x1,r.y1,z0],[r.x1,r.y1,z1],[r.x0,r.y1,z1]],shade(col,.93),EDGE);
  quad([[r.x1,r.y0,z0],[r.x1,r.y1,z0],[r.x1,r.y1,z1],[r.x1,r.y0,z1]],shade(col,.74),EDGE);
  quad([[r.x0,r.y0,z1],[r.x1,r.y0,z1],[r.x1,r.y1,z1],[r.x0,r.y1,z1]],top||shade(col,1.07),EDGE);

/* 보이는 앞면 위 사각형: 'L'=왼쪽 앞면(ry=y1), 'R'=오른쪽 앞면(rx=x1) */
function fr(f,r,a,b,z0,z1,col){
  if(f==='L')quad([[a,r.y1,z0],[b,r.y1,z0],[b,r.y1,z1],[a,r.y1,z1]],col);
  else quad([[r.x1,a,z0],[r.x1,b,z0],[r.x1,b,z1],[r.x1,a,z1]],col);
}
function feats(r,H,d){
  ['L','R'].forEach(function(f){
    var a0=f==='L'?r.x0:r.y0,a1=f==='L'?r.x1:r.y1,len=a1-a0,mid=(a0+a1)/2;
    var n=Math.max(1,Math.round(len/(d.bigwin?0.75:0.55)));
    for(var i=0;i<n;i++){
      var cx=a0+(i+.5)*len/n;
      if(f==='L'&&Math.abs(cx-mid)<0.3)continue;
      var ww=d.bigwin?0.26:(d.stained?0.1:0.11),z0=H*(d.stained?0.28:0.38),z1=H*(d.stained?0.8:0.72);
      var col=d.stained?['#5b82d6','#d6604f','#e3b341','#4fa37a'][i%4]:'#9cc3e3';
      fr(f,r,cx-ww,cx+ww,z0,z1,f==='R'?shade(col,.82):col);
    }
    if(f==='L'){
      var dw=d.deco==='barn'?0.24:0.13,dz=Math.min(H*0.58,0.55);
      fr('L',r,mid-dw,mid+dw,0.05,dz,d.deco==='barn'?'#6b4423':'#4a3628');
      if(d.deco==='barn'){var c=PJ.c,p1=P(mid-dw,r.y1,0.05),p2=P(mid+dw,r.y1,dz),p3=P(mid-dw,r.y1,dz),p4=P(mid+dw,r.y1,0.05);
        c.strokeStyle='rgba(255,230,190,.55)';c.lineWidth=Math.max(.6,PJ.s);c.beginPath();c.moveTo(p1[0],p1[1]);c.lineTo(p2[0],p2[1]);c.moveTo(p3[0],p3[1]);c.lineTo(p4[0],p4[1]);c.stroke();}
    }

}
function gable(r,z,rh,col,wall,alongX){

    var p=rotPt(f.x,f.y),q=P(p[0],p[1],1.1+(1.6-f.t)*.6);
    c.globalAlpha=clamp(f.t,0,1);c.font='700 '+Math.max(11,13*cam.z)+'px "IBM Plex Sans KR",sans-serif';c.textAlign='center';c.textBaseline='middle';
    c.lineWidth=3;c.strokeStyle='rgba(15,30,20,.85)';c.strokeText(f.text,q[0],q[1]);c.fillStyle='#fff';c.fillText(f.text,q[0],q[1]);c.globalAlpha=1;
  });
}
function iconCanvas(d){
  var W=66,H=46,cvs=document.createElement('canvas');
  cvs.width=W*2;cvs.height=H*2;cvs.style.width=W+'px';cvs.style.height=H+'px';
  var g=cvs.getContext('2d');g.scale(2,2);
  var tot=heightOf(d.id),wh=d.w+d.h;
  var s=Math.min((W-6)/(wh*HW),(H-4)/(wh*HH+tot*ZH+14));
  var keep={c:PJ.c,ox:PJ.ox,oy:PJ.oy,s:PJ.s},rot=ROT;
  ROT=0;PJ.c=g;PJ.s=s;PJ.ox=W/2-(d.w-d.h)*HW*s/2;PJ.oy=(H-(wh*HH+tot*ZH+14)*s)/2+(tot*ZH+14)*s;
  quad([[0,0,0],[d.w,0,0],[d.w,d.h,0],[0,d.h,0]],'#86b86f','rgba(40,80,30,.25)');
  drawEntity({x:0,y:0,def:d.id,id:7},Math.round(d.park*.6));
  ROT=rot;PJ.c=keep.c;PJ.ox=keep.ox;PJ.oy=keep.oy;PJ.s=keep.s;
  return cvs;
}

/* ---------- 카메라 ---------- */
function toScreen(rx,ry,z){return [cam.ox+(rx-ry)*HW*cam.z, cam.oy+(rx+ry)*HH*cam.z-(z||0)*ZH*cam.z];}
function toRot(px,py,z){var u=(px-cam.ox)/(HW*cam.z),v=(py-cam.oy+(z||0)*ZH*cam.z)/(HH*cam.z);return [(u+v)/2,(v-u)/2];}
function toWorld(px,py,z){var r=toRot(px,py,z);return unrot(r[0],r[1]);}
function viewCenter(){var r=$('#mid').getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2];}
function centerOn(wx,wy){var c=viewCenter(),r=rotPt(wx,wy);cam.ox=c[0]-(r[0]-r[1])*HW*cam.z;cam.oy=c[1]-(r[0]+r[1])*HH*cam.z;clampCam();}
function zoomAt(px,py,nz){
  nz=clamp(nz,ZMIN,ZMAX);
  var u=(px-cam.ox)/(HW*cam.z),v=(py-cam.oy)/(HH*cam.z);
  cam.z=nz;cam.ox=px-u*HW*nz;cam.oy=py-v*HH*nz;clampCam();
}
function clampCam(){
  var m=toScreen(RX()/2,RY()/2,0),dx=0,dy=0;
  if(m[0]<0)dx=-m[0];else if(m[0]>VW)dx=VW-m[0];
  if(m[1]<0)dy=-m[1];else if(m[1]>VH)dy=VH-m[1];
  cam.ox+=dx;cam.oy+=dy;
}
function fitZoom(){var r=$('#mid').getBoundingClientRect();return Math.min(r.width/((COLS+ROWS)*HW),(r.height+60)/((COLS+ROWS)*HH+30));}
function rotateView(){
  var c=viewCenter(),w=toWorld(c[0],c[1],0);
  ROT=(ROT+1)%4;centerOn(w[0],w[1]);toast(['남쪽','서쪽','북쪽','동쪽'][ROT]+'에서 보는 시점',1200);
}
function homeView(){
  var f=fitZoom();cam.z=clamp(f*1.75,ZMIN,ZMAX);
  var b=S.buildings.filter(function(b){return D[b.def].kind==='bld';})[0];
  if(b){var d=D[b.def];centerOn(b.x+d.w/2,b.y+d.h/2+1.5);}else centerOn(COLS/2,ROWS/2);

function groundTile(px,py){var w=toWorld(px,py,0);return {x:Math.floor(w[0]),y:Math.floor(w[1])};}
function pickBuilding(px,py){
  for(var z=3.8;z>=0;z-=0.06){
    var w=toWorld(px,py,z),tx=Math.floor(w[0]),ty=Math.floor(w[1]);
    if(tx<0||ty<0||tx>=COLS||ty>=ROWS)continue;
    var id=occ[ty][tx];
    if(id){var b=bById(id);if(b&&z<=heightOf(b.def)+.05)return id;}
  }
  return null;
}
function placeGhost(t){
  var d=D[UI.tool];
  UI.ghost={x:clamp(t.x-Math.floor((d.w-1)/2),0,COLS-d.w),y:clamp(t.y-Math.floor((d.h-1)/2),0,ROWS-1-d.h)};
}
function onGhostTile(t){
  if(!UI.ghost||!UI.tool||!D[UI.tool])return false;
  var d=D[UI.tool];return t.x>=UI.ghost.x&&t.x<UI.ghost.x+d.w&&t.y>=UI.ghost.y&&t.y<UI.ghost.y+d.h;
}
function onTap(px,py){
  if(S.over)return;
  if(UI.tool&&D[UI.tool]){placeGhost(groundTile(px,py));if(!UI.fold)renderDetail();return;}
  UI.sel=pickBuilding(px,py);
  if(UI.sel&&(UI.tab!=='build'||UI.fold)){UI.tab='build';UI.fold=false;syncTabs();renderPanel();}
  else renderDetail();
}
var ptrs=new Map(),gest=null;
function pts(){return Array.from(ptrs.values());}
function setupInput(){
  cv.addEventListener('pointerdown',function(e){
    try{cv.setPointerCapture(e.pointerId);}catch(_){}
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===1){gest={mode:'tap',sx:e.clientX,sy:e.clientY,lx:e.clientX,ly:e.clientY,onGhost:onGhostTile(groundTile(e.clientX,e.clientY))};}
    else if(ptrs.size===2){var a=pts();gest={mode:'pinch',d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1,z:cam.z,mx:(a[0].x+a[1].x)/2,my:(a[0].y+a[1].y)/2};}
  });
  cv.addEventListener('pointermove',function(e){
    if(!ptrs.has(e.pointerId)||!gest)return;
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(gest.mode==='pinch'&&ptrs.size>=2){
      var a=pts(),d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1,mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2;
      cam.ox+=mx-gest.mx;cam.oy+=my-gest.my;gest.mx=mx;gest.my=my;
      zoomAt(mx,my,gest.z*d/gest.d);return;
    }
    if(ptrs.size!==1)return;
    if(gest.mode==='tap'&&Math.hypot(e.clientX-gest.sx,e.clientY-gest.sy)>8){gest.mode=gest.onGhost?'ghost':'pan';cv.style.cursor=gest.mode==='pan'?'grabbing':'move';}
    if(gest.mode==='pan'){cam.ox+=e.clientX-gest.lx;cam.oy+=e.clientY-gest.ly;clampCam();}
    else if(gest.mode==='ghost'){placeGhost(groundTile(e.clientX,e.clientY));if(!UI.fold)renderDetail();}
    gest.lx=e.clientX;gest.ly=e.clientY;
  });
  var end=function(e){
    if(!ptrs.has(e.pointerId))return;
    ptrs.delete(e.pointerId);
    if(gest&&gest.mode==='tap'&&ptrs.size===0&&e.type==='pointerup')onTap(e.clientX,e.clientY);
    if(ptrs.size===0){gest=null;cv.style.cursor='grab';}
    else if(ptrs.size===1){var a=pts()[0];gest={mode:'pan',sx:a.x,sy:a.y,lx:a.x,ly:a.y};}
  };
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  cv.addEventListener('wheel',function(e){e.preventDefault();zoomAt(e.clientX,e.clientY,cam.z*Math.exp(-e.deltaY*0.0015));},{passive:false});
  $('#bRot').addEventListener('click',rotateView);
  $('#bIn').addEventListener('click',function(){var c=viewCenter();zoomAt(c[0],c[1],cam.z*1.3);});
  $('#bOut').addEventListener('click',function(){var c=viewCenter();zoomAt(c[0],c[1],cam.z/1.3);});
  $('#bHome').addEventListener('click',homeView);
}

  $('.tabs .fold').setAttribute('aria-label',UI.fold?'패널 펼치기':'패널 접기');

  var a=el.dataset.act,v=el.dataset.v;
  if(a==='cat'){UI.cat=v;UI.tool=null;UI.ghost=null;UI.sel=null;renderBuild();}
  else if(a==='dem'){UI.tool=(UI.tool==='demolish')?null:'demolish';UI.ghost=null;UI.sel=null;renderBuild();}
  else if(a==='pick'){
    UI.tool=(UI.tool===v)?null:v;UI.sel=null;
    if(UI.tool){var c=viewCenter();placeGhost(groundTile(c[0],c[1]));}else UI.ghost=null;
    refreshCards();renderDetail();
  }
  else if(a==='cancel'){UI.ghost=null;UI.tool=null;refreshCards();renderDetail();}
  else if(a==='confirm'){
    if(UI.tool&&UI.ghost&&build(UI.tool,UI.ghost.x,UI.ghost.y)){toast(D[UI.tool].name+'을(를) 지었어요',1600);UI.ghost=null;}
    renderDetail();hud(true);
  }
  else if(a==='demolish'){var b=bById(UI.sel);if(b){var nm=D[b.def].name;demolish(UI.sel);UI.sel=null;toast(nm+'을(를) 철거했어요',1600);}renderDetail();hud(true);}
  else if(a==='hire'){var s=STAFF[v],lv=S.staff[v];if(lv<3&&S.money>=s.costs[lv]){S.money-=s.costs[lv];S.staff[v]++;recalc();save();toast(s.name+' 단계 '+S.staff[v]+'로 올렸어요',1800);}renderStaff();hud(true);}
  else if(a==='fire'){if(S.staff[v]>0){S.staff[v]--;recalc();save();}renderStaff();hud(true);}
  else if(a==='newgame'){if(UI.confirmNew){restart();}else{UI.confirmNew=true;renderMenu();}}
}
function restart(){
  S=newState();V=[];F=[];UI.tool=null;UI.ghost=null;UI.sel=null;UI.confirmNew=false;UI.tab='build';UI.cat='worship';UI.fold=false;ROT=0;
  $('#over').hidden=true;rebuildOcc();recalc();syncTabs();renderPanel();homeView();hud(true);save();toast('새 교회를 시작합니다',2000);
}
var sized=false;
function resize(){
  var st=$('#stage'),w=st.clientWidth,h=st.clientHeight;
  if(!w||!h)return;
  var keep=sized?(function(){var c=viewCenter();return toWorld(c[0],c[1],0);})():null;
  VW=w;VH=h;DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);
  ZMIN=fitZoom()*0.85;
  if(!sized){sized=true;homeView();}
  else{cam.z=clamp(cam.z,ZMIN,ZMAX);centerOn(keep[0],keep[1]);}
}

/* ---------- 시작 ---------- */
var last=0;
function frame(ts){
  var dt=Math.min(0.25,(ts-last)/1000||0);last=ts;
  if(UI.speed>0&&!document.hidden){var sim=dt*UI.speed;while(sim>1e-6){var d=Math.min(0.1,sim);update(d);sim-=d;}}
  draw();hud(false);
  requestAnimationFrame(frame);
}
function init(){
  cv=$('#cv');ctx=cv.getContext('2d');
  S=load();rebuildOcc();recalc();
  document.querySelectorAll('.sp button').forEach(function(b){
    b.addEventListener('click',function(){
      UI.speed=+b.dataset.sp;
      document.querySelectorAll('.sp button').forEach(function(x){x.classList.toggle('on',x===b);});
    });
  });
  document.querySelectorAll('.tabs button').forEach(function(b){
    b.addEventListener('click',function(){
      if(b.dataset.tab==='fold'){UI.fold=!UI.fold;}
      else{UI.tab=b.dataset.tab;UI.fold=false;UI.confirmNew=false;}
      syncTabs();renderPanel();
    });
  });
  $('#panel').addEventListener('click',onPanel);
  $('#over').addEventListener('click',function(e){if(e.target.closest('[data-act="restart"]'))restart();});
  setupInput();
  if(window.ResizeObserver)new ResizeObserver(resize).observe($('#stage'));
  window.addEventListener('resize',resize);
  document.addEventListener('visibilitychange',function(){if(document.hidden)save();});
  resize();renderPanel();hud(true);
  setInterval(function(){if(UI.tab==='status'&&!UI.fold&&!S.over)renderStatus();},1500);
  if(S.over)showOver();
  requestAnimationFrame(frame);
}
if(window.__CT_TEST){window.__ct={get S(){return S;},get V(){return V;},update:update,build:build,canPlace:canPlace,D:D,DEFS:DEFS,recalc:recalc,init:init,draw:draw,
  setRot:function(r){ROT=r;},home:homeView,get UI(){return UI;},placeGhost:placeGhost};}
else init();
})();
</script>
