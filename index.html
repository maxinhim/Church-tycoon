<meta charset="utf-8">
<title>교회개척 타이쿤</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/hud.css">
<link rel="stylesheet" href="css/panel.css">
<link rel="stylesheet" href="css/responsive.css">

<div id="stage"><canvas id="cv" aria-label="교회 부지 지도. 드래그로 이동, 두 손가락으로 확대"></canvas></div>
<div id="ui">
  <header id="top" class="glass">
    <div class="ttl">
      <h1 id="cname">새빛교회</h1>
      <div class="goal"><span id="goalTxt"></span><div class="bar"><i id="goalBar" style="width:0%"></i></div></div>
    </div>
    <div class="sp" role="group" aria-label="게임 속도">
      <button data-sp="0" aria-label="일시정지">II</button>
      <button data-sp="1" class="on">1×</button>
      <button data-sp="2">2×</button>
      <button data-sp="4">4×</button>
    </div>
  </header>
  <div id="mid">
    <div id="toast" hidden></div>
    <div id="quick" class="glass" hidden></div>
    <div class="tools">
      <button class="glass" id="bStat" aria-label="현황 바로 보기" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></button>
      <button class="glass" id="bRot" aria-label="화면 회전"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4v4.5H15"/></svg></button>
      <button class="glass" id="bIn" aria-label="확대"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="glass" id="bOut" aria-label="축소"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      <button class="glass" id="bHome" aria-label="교회로 돌아가기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="12" cy="12" r="6.5"/><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4"/></svg></button>
    </div>
  </div>
  <div id="status" class="glass">
    <div class="stat"><span class="k">자금</span><b id="vMoney">0</b></div>
    <div class="stat"><span class="k">성도</span><b id="vMem">0</b></div>
    <div class="stat"><span class="k">평판</span><b id="vRep">0</b></div>
    <div class="stat"><span class="k" id="kDate">월요일</span><b id="vDate">1년 1주</b></div>
  </div>
  <section id="dock" class="glass">
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="build" class="on">건축</button>
      <button role="tab" data-tab="staff">사역자</button>
      <button role="tab" data-tab="events">행사</button>
      <button role="tab" data-tab="status">현황</button>
      <button role="tab" data-tab="menu">메뉴</button>
      <button class="fold" data-tab="fold" aria-label="패널 접기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    </nav>
    <div id="panel"></div>
  </section>
</div>
<div id="over" hidden></div>
<div id="dlg" hidden></div>
<div id="cele" hidden></div>
<div id="rotate" role="alert">
  <div class="box">
    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="14" y="5" width="20" height="38" rx="3.5"/><path d="M22 38h4"/><path d="M40 15a10 10 0 0 1-6 9.2M36.5 25.5l-2.5-1.3 1.3-2.7"/></svg>
    <h2>화면을 가로로 돌려주세요</h2>
    <p>이 게임은 가로 화면에서만 할 수 있어요. 게임은 잠시 멈춰 있고, 돌리면 이어집니다.</p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/buildings.js"></script>
<script src="js/state.js"></script>
<script src="js/pathfinding.js"></script>
<script src="js/visitors.js"></script>
<script src="js/sim.js"></script>
<script src="js/build.js"></script>
<script src="js/modular.js"></script>
<script src="js/doors.js"></script>
<script src="js/paths.js"></script>
<script src="js/floors.js"></script>
<script src="js/ministry.js"></script>
<script src="js/save.js"></script>
<script src="js/render-core.js"></script>
<script src="js/render-entities.js"></script>
<script src="js/render-scene.js"></script>
<script src="js/camera.js"></script>
<script src="js/hud.js"></script>
<script src="js/effects.js"></script>
<script src="js/panel.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>
